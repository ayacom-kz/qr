name: Keep Render awake

# Пингер: не даёт бесплатному сервису Render заснуть.
# Каждые 5 минут дёргает сайт, чтобы 15 минут тишины никогда не наступали.
# Работает бесплатно (репозиторий публичный) и не требует сторонних сервисов.

on:
  schedule:
    - cron: '*/5 * * * *'   # каждые 5 минут (минимум, разрешённый GitHub)
  workflow_dispatch:          # позволяет запустить вручную из вкладки Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          echo "Пингую https://ayacom-qr-badge.onrender.com/health ..."
          # --max-time 120: холодный старт Render из сна занимает ~40-50с, даём запас.
          # || true: не роняем workflow, если всё же таймаут.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://ayacom-qr-badge.onrender.com/health) || true
          echo "HTTP ${code:-timeout}"
          # 200 = живой; при пробуждении из сна первый ответ может быть медленным — это норма
